name: Build Windows GUI

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/build-windows-gui.yml"
  workflow_dispatch:

concurrency:
  group: build-windows-gui-main
  cancel-in-progress: true

env:
  HUSKY: 0
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  build-windows-gui:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild Electron native dependencies
        run: pnpm --filter=deemix-gui exec pnpm electron-rebuild

      - name: Build Windows GUI
        run: pnpm make

      - name: Prepare single EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "packages/gui/out" -Recurse -File | Where-Object { $_.Name -match "Setup\.exe$" } | Select-Object -First 1
          if (-not $installer) { throw "Windows installer EXE was not produced." }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item $installer.FullName "dist/Deemix.exe" -Force

      - name: Publish single-file Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $mainSha = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq ".sha"
          if ($mainSha -ne $env:GITHUB_SHA) {
            Write-Host "A newer main commit exists; skipping outdated publish."
            exit 0
          }
          git tag -f windows-latest $env:GITHUB_SHA
          git push origin refs/tags/windows-latest --force
          gh release view windows-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Deemix Windows GUI" --notes "Under construction ⚠️ - Download Deemix.exe and double-click it." --prerelease
          } else {
            gh release edit windows-latest --repo $env:GITHUB_REPOSITORY --title "Deemix Windows GUI" --notes "Under construction ⚠️ - Download Deemix.exe and double-click it." --prerelease
          }
          gh release upload windows-latest "dist/Deemix.exe#Deemix.exe" --repo $env:GITHUB_REPOSITORY --clobber
