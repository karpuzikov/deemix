name: Build Windows GUI

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/build-windows-gui.yml"
  workflow_dispatch:

env:
  HUSKY: 0
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  build-windows-gui:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild Electron native dependencies
        run: pnpm --filter=deemix-gui exec pnpm electron-rebuild

      - name: Build Windows GUI
        run: pnpm make

      - name: Upload Windows GUI
        uses: actions/upload-artifact@v4
        with:
          name: Deemix-Windows-GUI
          if-no-files-found: error
          retention-days: 30
          path: |
            packages/gui/out/**/Deemix.exe
            packages/gui/out/**/Deemix*Setup.exe
            packages/gui/out/make/zip/**/*.zip
