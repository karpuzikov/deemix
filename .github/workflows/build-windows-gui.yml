name: Build Windows GUI

on:
  push:
    branches:
      - main
    paths:
      - "packages/gui/**"
      - "packages/webui/**"
      - "packages/deemix/**"
      - "packages/deezer-sdk/**"
      - "!packages/**/CONTINUITY.md"
      - "!packages/**/README.md"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/build-windows-gui.yml"
  workflow_dispatch:

concurrency:
  group: build-windows-gui-main
  cancel-in-progress: true

env:
  HUSKY: 0
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  build-windows-gui:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild Electron native dependencies
        run: pnpm --filter=deemix-gui exec pnpm electron-rebuild

      - name: Test Windows credential protection
        shell: pwsh
        run: pnpm --filter=deemix exec vitest run src/credentials.test.ts

      - name: Build Windows GUI
        run: pnpm make

      - name: Smoke-test packaged Windows GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem "packages/gui/out" -Recurse -File |
            Where-Object { $_.Name -eq "deemix-gui.exe" -and $_.FullName -match "win32" } |
            Select-Object -First 1
          if (-not $exe) { throw "Packaged GUI executable was not produced." }
          $appProcess = Start-Process -FilePath $exe.FullName -PassThru
          $healthy = $false
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($appProcess.HasExited) { throw "Deemix GUI exited during startup." }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:6595/" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $healthy) { throw "Packaged GUI did not start its localhost server." }
          } finally {
            if (-not $appProcess.HasExited) { Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Prepare versioned Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "packages/gui/out" -Recurse -File |
            Where-Object { $_.Name -match "Setup\.exe$" } | Select-Object -First 1
          if (-not $installer) { throw "Windows installer EXE was not produced." }
          $version = (Get-Content "packages/gui/package.json" -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid GUI version: $version" }
          $assetName = "Deemix v$version.exe"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item $installer.FullName (Join-Path "dist" $assetName) -Force
          if ((Get-Item -LiteralPath (Join-Path "dist" $assetName)).Length -lt 1000000) {
            throw "GUI installer is unexpectedly small."
          }

      - name: Publish versioned Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $mainSha = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq ".sha"
          if ($mainSha -ne $env:GITHUB_SHA) {
            Write-Host "Newer main exists; skipping outdated publish."
            exit 0
          }
          $version = (Get-Content "packages/gui/package.json" -Raw | ConvertFrom-Json).version
          $assetName = "Deemix v$version.exe"
          $assetPath = Join-Path "dist" $assetName
          if (-not (Test-Path -LiteralPath $assetPath)) { throw "Versioned installer missing." }
          $releaseTitle = "Deemix v$version - Under construction ⚠️"
          $releaseNotes = "Deemix v$version - Under construction ⚠️. Windows installer. Verify startup and login before marking stable."
          git tag -f windows-latest $env:GITHUB_SHA
          git push origin refs/tags/windows-latest --force
          gh release view windows-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $releaseTitle --notes $releaseNotes --prerelease
          } else {
            gh release edit windows-latest --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $releaseTitle --notes $releaseNotes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not prepare release." }
          # GitHub normalizes spaces to periods; avoid a duplicate asset 422 on retries.
          $publishedAssetName = $assetName.Replace(" ", ".")
          $existing = @(gh release view windows-latest --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Cannot enumerate release assets." }
          if ($publishedAssetName -notin $existing) {
            gh release upload windows-latest "$assetPath#$assetName" --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Versioned upload failed." }
          }
          $assets = @(gh release view windows-latest --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0 -or $publishedAssetName -notin $assets) { throw "Versioned asset verification failed." }
          foreach ($oldAsset in $assets) {
            if ($oldAsset -and $oldAsset -ne $publishedAssetName) {
              gh release delete-asset windows-latest "$oldAsset" --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "Cannot remove outdated asset $oldAsset." }
            }
          }
