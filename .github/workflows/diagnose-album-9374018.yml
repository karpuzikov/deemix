name: Diagnose Deezer Album 9374018

on:
  push:
    branches:
      - diag-album-9374018
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Deezer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $album = Invoke-RestMethod "https://api.deezer.com/album/9374018"
          Write-Host "ALBUM_JSON_START"
          $album | Select-Object id,title,upc,release_date,available,nb_tracks,@{n='artist_id';e={$_.artist.id}},@{n='artist_name';e={$_.artist.name}},contributors | ConvertTo-Json -Depth 8
          Write-Host "ALBUM_JSON_END"

          $artistId = $album.artist.id
          $artistName = [uri]::EscapeDataString($album.artist.name)
          Write-Host "ARTIST_ID=$artistId"
          Write-Host "ARTIST_NAME=$($album.artist.name)"

          $foundArtistAlbums = $false
          for ($index = 0; $index -lt 5000; $index += 100) {
            $page = Invoke-RestMethod "https://api.deezer.com/artist/$artistId/albums?limit=100&index=$index"
            if ($page.data | Where-Object { $_.id -eq 9374018 }) { $foundArtistAlbums = $true }
            if (-not $page.next) { break }
          }
          Write-Host "FOUND_IN_ARTIST_ALBUMS=$foundArtistAlbums"

          $foundSearch = $false
          for ($index = 0; $index -lt 5000; $index += 100) {
            $page = Invoke-RestMethod "https://api.deezer.com/search/album?q=$artistName&limit=100&index=$index"
            $match = $page.data | Where-Object { $_.id -eq 9374018 }
            if ($match) {
              $foundSearch = $true
              Write-Host "SEARCH_MATCH_JSON_START"
              $match | ConvertTo-Json -Depth 8
              Write-Host "SEARCH_MATCH_JSON_END"
            }
            if (-not $page.next) { break }
          }
          Write-Host "FOUND_IN_ALBUM_SEARCH=$foundSearch"

          $foundTrackSearch = $false
          $trackAlbumIds = New-Object System.Collections.Generic.HashSet[string]
          $trackQuery = [uri]::EscapeDataString('artist:"' + $album.artist.name + '"')
          for ($index = 0; $index -lt 5000; $index += 100) {
            $page = Invoke-RestMethod "https://api.deezer.com/search/track?q=$trackQuery&limit=100&index=$index"
            foreach ($track in @($page.data)) {
              if ($track.artist.id -eq $artistId) {
                [void]$trackAlbumIds.Add([string]$track.album.id)
                if ($track.album.id -eq 9374018) {
                  $foundTrackSearch = $true
                  Write-Host "TRACK_SEARCH_MATCH_JSON_START"
                  $track | Select-Object id,title,@{n='artist_id';e={$_.artist.id}},@{n='artist_name';e={$_.artist.name}},album | ConvertTo-Json -Depth 8
                  Write-Host "TRACK_SEARCH_MATCH_JSON_END"
                }
              }
            }
            if (-not $page.next) { break }
          }
          Write-Host "FOUND_IN_TRACK_SEARCH=$foundTrackSearch"
          Write-Host "TRACK_SEARCH_UNIQUE_ALBUMS=$($trackAlbumIds.Count)"

          $exactQuery = [uri]::EscapeDataString('artist:"Inna" track:"Diggy Down"')
          $exact = Invoke-RestMethod "https://api.deezer.com/search/track?q=$exactQuery&limit=100"
          $exactMatch = $exact.data | Where-Object { $_.album.id -eq 9374018 }
          Write-Host "FOUND_IN_EXACT_TRACK_SEARCH=$([bool]$exactMatch)"
