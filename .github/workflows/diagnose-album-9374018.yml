name: Diagnose Deezer Album 9374018

on:
  push:
    branches:
      - diag-album-9374018
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Deezer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $album = Invoke-RestMethod "https://api.deezer.com/album/9374018"
          Write-Host "ALBUM_JSON_START"
          $album | Select-Object id,title,upc,release_date,available,nb_tracks,@{n='artist_id';e={$_.artist.id}},@{n='artist_name';e={$_.artist.name}},contributors | ConvertTo-Json -Depth 8
          Write-Host "ALBUM_JSON_END"

          $artistId = $album.artist.id
          $artistName = [uri]::EscapeDataString($album.artist.name)
          Write-Host "ARTIST_ID=$artistId"
          Write-Host "ARTIST_NAME=$($album.artist.name)"

          $foundArtistAlbums = $false
          for ($index = 0; $index -lt 5000; $index += 100) {
            $page = Invoke-RestMethod "https://api.deezer.com/artist/$artistId/albums?limit=100&index=$index"
            if ($page.data | Where-Object { $_.id -eq 9374018 }) { $foundArtistAlbums = $true }
            if (-not $page.next) { break }
          }
          Write-Host "FOUND_IN_ARTIST_ALBUMS=$foundArtistAlbums"

          $foundSearch = $false
          for ($index = 0; $index -lt 5000; $index += 100) {
            $page = Invoke-RestMethod "https://api.deezer.com/search/album?q=$artistName&limit=100&index=$index"
            $match = $page.data | Where-Object { $_.id -eq 9374018 }
            if ($match) {
              $foundSearch = $true
              Write-Host "SEARCH_MATCH_JSON_START"
              $match | ConvertTo-Json -Depth 8
              Write-Host "SEARCH_MATCH_JSON_END"
            }
            if (-not $page.next) { break }
          }
          Write-Host "FOUND_IN_ALBUM_SEARCH=$foundSearch"

          $foundTrackSearch = $false
          $trackAlbumIds = New-Object System.Collections.Generic.HashSet[string]
          $trackQuery = [uri]::EscapeDataString('artist:"' + $album.artist.name + '"')
          for ($index = 0; $index -lt 5000; $index += 100) {
            $page = Invoke-RestMethod "https://api.deezer.com/search/track?q=$trackQuery&limit=100&index=$index"
            foreach ($track in @($page.data)) {
              if ($track.artist.id -eq $artistId) {
                [void]$trackAlbumIds.Add([string]$track.album.id)
                if ($track.album.id -eq 9374018) {
                  $foundTrackSearch = $true
                  Write-Host "TRACK_SEARCH_MATCH_JSON_START"
                  $track | Select-Object id,title,@{n='artist_id';e={$_.artist.id}},@{n='artist_name';e={$_.artist.name}},album | ConvertTo-Json -Depth 8
                  Write-Host "TRACK_SEARCH_MATCH_JSON_END"
                }
              }
            }
            if (-not $page.next) { break }
          }
          Write-Host "FOUND_IN_TRACK_SEARCH=$foundTrackSearch"
          Write-Host "TRACK_SEARCH_UNIQUE_ALBUMS=$($trackAlbumIds.Count)"

          $exactQuery = [uri]::EscapeDataString('artist:"Inna" track:"Diggy Down"')
          $exact = Invoke-RestMethod "https://api.deezer.com/search/track?q=$exactQuery&limit=100"
          $exactMatch = $exact.data | Where-Object { $_.album.id -eq 9374018 }
          Write-Host "FOUND_IN_EXACT_TRACK_SEARCH=$([bool]$exactMatch)"

          $plainTrack = Invoke-RestMethod "https://api.deezer.com/search/track?q=Inna&limit=100&index=0"
          $plainTrackMatch = $plainTrack.data | Where-Object { $_.album.id -eq 9374018 }
          Write-Host "FOUND_IN_PLAIN_TRACK_SEARCH=$([bool]$plainTrackMatch)"
          Write-Host "PLAIN_TRACK_TOTAL=$($plainTrack.total)"

          $titleAlbum = Invoke-RestMethod "https://api.deezer.com/search/album?q=Diggy%20Down&limit=100"
          $titleAlbumMatch = $titleAlbum.data | Where-Object { $_.id -eq 9374018 }
          Write-Host "FOUND_IN_TITLE_ALBUM_SEARCH=$([bool]$titleAlbumMatch)"

          $titleTrack = Invoke-RestMethod "https://api.deezer.com/search/track?q=Diggy%20Down&limit=100"
          $titleTrackMatch = $titleTrack.data | Where-Object { $_.album.id -eq 9374018 }
          Write-Host "FOUND_IN_TITLE_TRACK_SEARCH=$([bool]$titleTrackMatch)"

          $mbHeaders = @{ "User-Agent" = "karpuzikov-deemix-diagnostic/1.0 (https://github.com/karpuzikov/deemix)" }
          $mbBarcode = Invoke-RestMethod "https://musicbrainz.org/ws/2/release/?query=barcode:5948204052898&fmt=json&limit=10" -Headers $mbHeaders
          Write-Host "MUSICBRAINZ_BARCODE_COUNT=$($mbBarcode.count)"
          if ($mbBarcode.releases) {
            Write-Host "MUSICBRAINZ_BARCODE_MATCH_START"
            $mbBarcode.releases | Select-Object id,title,barcode,date,status,country | ConvertTo-Json -Depth 6
            Write-Host "MUSICBRAINZ_BARCODE_MATCH_END"
          }

          Start-Sleep -Milliseconds 1200
          $urlQuery = [uri]::EscapeDataString('resource:"https://www.deezer.com/artist/288252"')
          $mbUrlSearch = Invoke-RestMethod "https://musicbrainz.org/ws/2/url/?query=$urlQuery&fmt=json&limit=10" -Headers $mbHeaders
          Write-Host "MUSICBRAINZ_URL_COUNT=$($mbUrlSearch.count)"
          if ($mbUrlSearch.urls) {
            Write-Host "MUSICBRAINZ_URL_SEARCH_START"
            $mbUrlSearch.urls | ConvertTo-Json -Depth 10
            Write-Host "MUSICBRAINZ_URL_SEARCH_END"
            $urlId = $mbUrlSearch.urls[0].id
            Start-Sleep -Milliseconds 1200
            $mbUrlLookup = Invoke-RestMethod "https://musicbrainz.org/ws/2/url/$urlId?inc=artist-rels&fmt=json" -Headers $mbHeaders
            Write-Host "MUSICBRAINZ_URL_LOOKUP_START"
            $mbUrlLookup | ConvertTo-Json -Depth 12
            Write-Host "MUSICBRAINZ_URL_LOOKUP_END"
          }

          Start-Sleep -Milliseconds 1200
          try {
            $directResource = [uri]::EscapeDataString('https://www.deezer.com/artist/288252')
            $directUrl = Invoke-RestMethod "https://musicbrainz.org/ws/2/url?resource=$directResource&inc=artist-rels&fmt=json" -Headers $mbHeaders
            Write-Host "MUSICBRAINZ_DIRECT_URL_START"
            $directUrl | ConvertTo-Json -Depth 12
            Write-Host "MUSICBRAINZ_DIRECT_URL_END"
          } catch {
            Write-Host "MUSICBRAINZ_DIRECT_URL_ERROR=$($_.Exception.Message)"
          }

